<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAR-BRIDGE AI</title>
  <meta name="description" content="Where Mingachevir Reservoir's water changed between two NASA-ISRO NISAR radar passes, and which explanations the evidence supports.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f766e'/><path d='M8 21a8 8 0 0 1 16 0M12 21a4 4 0 0 1 8 0' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M8 21a8 8 0 0 1 16 0M12 21a4 4 0 0 1 8 0" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span class="name">SAR-BRIDGE AI</span>
  </div>
  <p class="context" id="context">Mingachevir Reservoir, Azerbaijan</p>
  <div class="actions">
    <span class="pill pill-warn" title="Both NISAR scenes are Provisional data-maturity products">Provisional data</span>
    <button id="btn-method" class="btn" type="button">Method &amp; data</button>
  </div>
</header>

<main class="app">
  <section class="map-area" aria-label="Map">
    <div id="map"></div>

    <div class="toolbar" role="group" aria-label="Map layers">
      <div class="seg" id="imagery-seg" role="radiogroup" aria-label="Imagery">
        <button type="button" data-img="HH" class="on" role="radio" aria-checked="true">Radar HH</button>
        <button type="button" data-img="HV" role="radio" aria-checked="false">Radar HV</button>
        <button type="button" data-img="S2" role="radio" aria-checked="false">Optical</button>
      </div>
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="chk-slider" checked> Compare</label>
        <label class="tg"><input type="checkbox" id="chk-change" checked> Change</label>
        <label class="tg"><input type="checkbox" id="chk-sectors" checked> Sectors</label>
        <label class="tg"><input type="checkbox" id="chk-osm"> OSM outline</label>
      </div>
    </div>

    <div id="divider" class="divider" aria-hidden="true">
      <div class="flag l" id="flag-before"></div>
      <div class="flag r" id="flag-after"></div>
      <div class="handle" tabindex="0" role="slider" aria-label="Before and after comparison position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 2 10l5 5M13 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="solo-flag" id="solo-flag" hidden></div>

    <div class="legend" id="legend">
      <div class="lg-block" id="lg-change">
        <div class="lg-title">Detected change</div>
        <div class="lg-row"><i class="sw loss"></i>Water loss<span>water → land</span></div>
        <div class="lg-row"><i class="sw gain"></i>Water gain<span>land → water</span></div>
        <div class="lg-row"><i class="sw dark"></i>Radar-dark both dates<span>water or smooth ground</span></div>
        <div class="lg-row"><i class="sw nodata"></i>Insufficient data</div>
      </div>
      <div class="lg-block" id="lg-scale">
        <div class="lg-title" id="lg-scale-title">Radar backscatter <span class="nocase">γ<sup>0</sup></span> HH</div>
        <div class="ramp"></div>
        <div class="ramp-labels"><span id="lg-min">−25 dB</span><span id="lg-max">0 dB</span></div>
      </div>
    </div>
  </section>

  <aside class="panel" aria-label="Analysis">
    <section class="summary" id="stats" aria-label="Change statistics"></section>
    <section class="chart-block" aria-labelledby="chart-title">
      <div class="block-head">
        <h2 id="chart-title">Water change by sector</h2>
        <span class="hint">NW inflow end → SE dam</span>
      </div>
      <div id="profile" class="profile" role="group" aria-label="Water change per sector along the reservoir"></div>
    </section>
    <section class="card" id="analysis-card" aria-live="polite"></section>
  </aside>
</main>

<div class="drawer" id="method" role="dialog" aria-modal="true" aria-labelledby="method-title" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="method-title">Method &amp; data</h2>
      <button class="btn" id="btn-close" type="button">Close</button>
    </div>
    <div id="method-body"></div>
  </div>
</div>

<noscript>This application needs JavaScript to display the map.</noscript>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="js/app.js"></script>
</body>
</html>
